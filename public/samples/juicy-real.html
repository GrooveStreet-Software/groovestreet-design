<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Juicy — 3D Product Showcase</title>
  <style>
    :root {
      --bg: #0a0a0a;
      --fg: #fff;
      --accent: #82af38;
      --muted: rgba(255, 255, 255, 0.6);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; }
    body {
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--fg);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }
    #root { width: 100%; height: 100dvh; position: relative; overflow: hidden; }
    canvas { display: block; }

    /* ---------- Loading / fallback shell ---------- */
    .boot {
      position: absolute; inset: 0; z-index: 40;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 18px; background: var(--bg);
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }
    .boot[hidden] { display: flex; opacity: 0; visibility: hidden; pointer-events: none; }
    .spinner {
      width: 44px; height: 44px; border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.18);
      border-top-color: var(--accent);
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .boot-label { font-size: 12px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted); }
    .boot-bar { width: min(240px, 60vw); height: 2px; background: rgba(255, 255, 255, 0.14); overflow: hidden; }
    .boot-bar > i { display: block; height: 100%; width: 0%; background: var(--accent); transition: width 0.35s ease; }
    .boot-detail { font-size: 11px; letter-spacing: 0.08em; color: rgba(255, 255, 255, 0.4); min-height: 14px; }

    .fallback {
      position: absolute; inset: 0; z-index: 50; display: none;
      flex-direction: column; align-items: center; justify-content: center; gap: 16px;
      padding: 32px; text-align: center; background: var(--bg);
    }
    .fallback.show { display: flex; }
    .fallback h2 { font-size: 1.35rem; font-weight: 700; letter-spacing: -0.02em; }
    .fallback p { max-width: 46ch; font-size: 0.9rem; line-height: 1.6; color: var(--muted); }
    .fallback button {
      margin-top: 4px; padding: 12px 28px; border: 0; border-radius: 999px;
      background: var(--accent); color: #fff; font: inherit; font-weight: 600; cursor: pointer;
    }
    .fallback button:hover { filter: brightness(1.08); }
    .fallback code { font-size: 11px; color: rgba(255, 255, 255, 0.35); }

    /* ---------- Stage ---------- */
    .stage { position: absolute; inset: 0; overflow: hidden; }
    .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; }

    .bg-water {
      position: absolute; inset: 0; z-index: 0;
      background: var(--bg);
      transition: background-color 1s ease-in-out;
    }
    .bg-orb {
      position: absolute; left: 50%; top: 50%; z-index: 1;
      width: 700px; height: 700px; margin: -350px 0 0 -350px;
      border-radius: 50%; filter: blur(220px); opacity: 0.75;
      transition: background-color 1s ease-in-out;
      pointer-events: none;
    }

    /* ---------- Overlay UI ---------- */
    .ui { position: absolute; inset: 0; z-index: 10; pointer-events: none; }
    .ui > * { pointer-events: auto; }

    .wordmark {
      position: absolute; top: 28px; left: 50%; transform: translateX(-50%);
      font-size: clamp(1.6rem, 4vw, 2.6rem); font-weight: 900; letter-spacing: 0.14em;
      color: #fff; text-shadow: 0 2px 24px rgba(0, 0, 0, 0.35);
      user-select: none;
    }

    .product-info {
      position: absolute; left: 56px; bottom: 56px; max-width: 460px;
      opacity: 0; transform: translateY(16px);
      transition: opacity 0.45s ease, transform 0.45s ease;
    }
    .product-info.reveal { opacity: 1; transform: translateY(0); }
    .product-info h1 {
      font-size: clamp(1.9rem, 4vw, 3rem); font-weight: 300; line-height: 1.05;
      color: #fff; text-shadow: 0 2px 20px rgba(0, 0, 0, 0.4); margin-bottom: 12px;
    }
    .product-info p {
      font-size: 0.95rem; line-height: 1.65; color: rgba(255, 255, 255, 0.86);
      text-shadow: 0 1px 14px rgba(0, 0, 0, 0.4); margin-bottom: 18px;
    }
    .product-info button {
      padding: 10px 26px; border: 0; border-radius: 999px; font: inherit;
      font-weight: 600; cursor: pointer; transition: opacity 0.3s ease, transform 0.3s ease;
    }
    .product-info button:hover { opacity: 0.85; transform: translateY(-2px); }

    .sizes {
      position: absolute; right: 56px; bottom: 56px; display: flex; gap: 10px;
    }
    .sizes button {
      min-width: 58px; padding: 9px 12px; border: 1px solid rgba(255, 255, 255, 0.55);
      border-radius: 999px; background: transparent; color: #fff; font: inherit;
      font-size: 0.8rem; font-weight: 600; cursor: pointer;
      transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
    }
    .sizes button[aria-pressed="true"] { background: #fff; color: #111; border-color: #fff; }

    .controls {
      position: absolute; left: 50%; bottom: 46px; transform: translateX(-50%);
      display: flex; gap: 30px;
    }
    .arrow {
      width: 48px; height: 48px; display: flex; align-items: center; justify-content: center;
      border-radius: 50%; border: 1px solid rgba(255, 255, 255, 0.5);
      background: rgba(255, 255, 255, 0.2); color: #fff; cursor: pointer;
      transition: background-color 0.3s ease, transform 0.3s ease, opacity 0.3s ease;
    }
    .arrow:hover:not(:disabled) { background: rgba(255, 255, 255, 0.4); transform: scale(1.06); }
    .arrow:disabled { opacity: 0.35; cursor: default; }

    .dots {
      position: absolute; left: 50%; bottom: 108px; transform: translateX(-50%);
      display: flex; gap: 8px;
    }
    .dots button {
      width: 8px; height: 8px; padding: 0; border: 0; border-radius: 50%;
      background: rgba(255, 255, 255, 0.4); cursor: pointer;
      transition: background-color 0.3s ease, transform 0.3s ease;
    }
    .dots button[aria-current="true"] { background: #fff; transform: scale(1.35); }

    @media (max-width: 820px) {
      .product-info { left: 20px; right: 20px; bottom: 130px; max-width: none; }
      .sizes { right: 20px; bottom: 96px; }
      .controls { bottom: 34px; }
      .dots { bottom: 88px; }
    }
  </style>
</head>
<body>
  <div id="root">
    <div class="stage" id="stage">
      <div class="bg-orb" id="bg-orb"></div>
      <div class="bg-water" id="bg-water"></div>
      <canvas id="scene"></canvas>
      <div class="ui" id="ui">
        <div class="wordmark" id="wordmark">JUICY</div>

        <div class="product-info" id="product-info">
          <h1 id="product-name">Lemon Ginger</h1>
          <p id="product-desc"></p>
          <button type="button" id="see-more">See More</button>
        </div>

        <div class="sizes" id="sizes"></div>

        <div class="controls">
          <button type="button" class="arrow" id="prev" aria-label="Previous flavor">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
              <path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </button>
          <button type="button" class="arrow" id="next" aria-label="Next flavor">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
              <path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </button>
        </div>

        <div class="dots" id="dots"></div>
      </div>
    </div>

    <div class="boot" id="boot">
      <div class="spinner"></div>
      <div class="boot-label" id="boot-label">Loading Experience</div>
      <div class="boot-bar"><i id="boot-bar-fill"></i></div>
      <div class="boot-detail" id="boot-detail">Preparing 3D scene…</div>
    </div>

    <div class="fallback" id="fallback" role="alert">
      <h2 id="fallback-title">3D preview unavailable</h2>
      <p id="fallback-text">
        The 3D scene could not be rendered in this browser. The page stays responsive and
        the product details below are still available.
      </p>
      <button type="button" id="fallback-retry">Try again</button>
      <code id="fallback-detail"></code>
    </div>
  </div>

  
  <script type="importmap">
  {
    "imports": {
      "three": "/juicy-assets/vendor/three/three.module.js",
      "three/addons/": "/juicy-assets/vendor/three/"
    }
  }
  </script>

  <script type="module" src="/juicy-assets/vendor/juicy-scene.mjs"></script>
</body>
</html>
